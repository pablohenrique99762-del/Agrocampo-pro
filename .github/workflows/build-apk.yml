name: Build AgroCampo Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AgroCampoAndroid/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar APK
        run: gradle -p AgroCampoAndroid assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AgroCampo-Pro-APK
          path: AgroCampoAndroid/app/build/outputs/apk/debug/app-debug.apk
          
